<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Security | Register Visitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="security-common.css" />
<link rel="stylesheet" href="security-register.css" />
</head>
<body>
<div class="app-shell">

  <div class="topnav">
    <a class="back-link" href="security-dashboard.html">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      Register
    </a>
    <span></span>
  </div>

  <div class="page-body">
    <p class="step-label">Who are you registering?</p>
    <div class="type-list">
      <button class="type-row" id="walkinCard">
        <div class="type-icon" style="background:var(--blue-light);color:var(--blue)">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
        </div>
        <div class="type-text">
          <div class="type-title">Walk-in Visitor</div>
          <div class="type-sub">Register a visitor without a prior appointment</div>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <button class="type-row" id="deliveryCard">
        <div class="type-icon" style="background:var(--orange-light);color:var(--orange)">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="9" width="14" height="10" rx="1"/><path d="M17 12h2.5l1.5 3v4h-4"/><circle cx="7" cy="19.5" r="1.5"/><circle cx="17.5" cy="19.5" r="1.5"/></svg>
        </div>
        <div class="type-text">
          <div class="type-title">Delivery Person</div>
          <div class="type-sub">Register a courier, vendor or parcel drop-off</div>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="security-common.js"></script>
<script src="security-register.js"></script>
</body>
</html>
