<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EduGate VMS | Confirm Details</title>
<link rel="stylesheet" href="pre-approved-confirm.css">
</head>
<body>

  <div class="app-frame">

    <header class="top-bar">
      <button class="icon-btn back-btn" type="button" id="backBtn" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/>
          <path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1 id="brandTitle">Pre Approved Visitor</h1>
      </div>

      <!-- <button class="icon-btn bell-btn" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="dot" aria-hidden="true"></span>
      </button> -->
    </header>

    <main class="content">

      <section class="verified-banner">
        <div class="verified-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1c8a4c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="verified-text">
          <h3 id="verifiedTitle">QR Code Verified</h3>
          <p id="invitationId">Invitation ID: INV-2024-08-1847</p>
        </div>
      </section>

      <section class="details-card">
        <h2 id="detailsTitle">Confirm Your Details</h2>
        <div class="details-list" id="detailsList">
          <!-- rows injected by pre-approved-confirm.js -->
        </div>
      </section>

      <button class="btn-primary" id="confirmBtn" type="button">Confirm Check-in</button>
      <p class="alt-link"><a id="rescanLink" href="pre-approved-scan.html">Re-scan QR</a></p>

    </main>

  </div>

  <script src="pre-approved-confirm.js"></script>
</body>
</html>
