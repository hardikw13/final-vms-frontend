<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>EduGate VMS | Invite Visitor</title>

    <link rel="stylesheet" href="host-dashboard.css">
    <link rel="stylesheet" href="create-visit.css">
</head>

<body>

<div class="app-frame">

    <!-- Header -->

    
        <header class="top-bar">

    <button class="icon-btn" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </button>

   <div class="brand-icon" aria-hidden="true">

    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round">

        <path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/>

        <path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>

    </svg>

</div>
    <div class="brand-text">
        <div class="brand-title-row">
            <h1>Invite Visitor</h1>
            <span class="role-pill">Host</span>
        </div>
        <p>Create a Pre-Approved Visit</p>
    </div>

</header>


    </header>

    <main class="content">

        <!-- Hero -->

        <section class="hero-card">

            <h2>Invite a Visitor</h2>

            <p>
                Fill in the visitor details below.
                A digital visitor pass will be generated after approval.
            </p>

        </section>

        <!-- Visitor Information -->

        <section class="form-card">

            <h3>👤 Visitor Information</h3>

            <div class="form-group">

                <label>Full Name</label>

                <input
                    id="fullName"
                    type="text"
                    placeholder="Enter visitor name"
                >

            </div>

            <div class="form-group">

                <label>Email Address</label>

                <input
                    id="email"
                    type="email"
                    placeholder="visitor@example.com"
                >

            </div>

            <div class="form-group">

                <label>Phone Number</label>

                <input
                    id="phone"
                    type="tel"
                    placeholder="+91 XXXXXXXXXX"
                >

            </div>

            <div class="form-group">

                <label>Organization</label>

                <input
                    id="organization"
                    type="text"
                    placeholder="Company / Institute (Optional)"
                >

            </div>

        </section>

        <!-- Visit Details -->

        <section class="form-card">

            <h3>📅 Visit Details</h3>

            <div class="form-group">

                <label>Purpose</label>

                <input
                    id="purpose"
                    type="text"
                    placeholder="Purpose of visit"
                >

            </div>

            <div class="row">

                <div class="form-group">

                    <label>Visit Date</label>

                    <input
                        id="visitDate"
                        type="date"
                    >

                </div>

                <div class="form-group">

                    <label>Arrival Time</label>

                    <input
                        id="visitTime"
                        type="time"
                    >

                </div>

            </div>

        </section>

        <!-- Buttons -->

        <div class="action-buttons">

            <button
                id="cancelBtn"
                class="cancel-btn"
            >
                Cancel
            </button>

            <button
                id="inviteBtn"
                class="invite-btn-main"
            >
                + Invite Visitor
            </button>

        </div>

    </main>

</div>

<script src="create-visit.js"></script>

</body>

</html>
