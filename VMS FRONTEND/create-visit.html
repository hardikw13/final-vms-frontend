<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>EduGate VMS | Invite Visitor</title>

    <link rel="stylesheet" href="host-dashboard.css">
    <link rel="stylesheet" href="create-visit.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
</head>

<body>

<div class="app-frame">

    <!-- Header -->

    <header class="top-bar">

        <button class="icon-btn" id="backBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>

        <div class="brand-icon" aria-hidden="true">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/>

                <path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>

            </svg>

        </div>

        <div class="brand-text">
            <div class="brand-title-row">
                <h1>Invite Visitor</h1>
                <span class="role-pill">Host</span>
            </div>
            <p>Create a Pre-Approved Visit</p>
        </div>

    </header>

    <main class="content">

        <!-- Hero -->

        <section class="hero-card">

            <div class="hero-icon">
                👤
            </div>

            <div class="hero-content">

                <h2>Invite a Visitor</h2>

                <p>
                    Fill in the visitor details below.
                    A digital visitor pass will be generated after approval.
                </p>

            </div>

            <div class="hero-plane">
                ✈
            </div>

        </section>

        <!-- Visitor Information -->

        <section class="form-card">

            <h3>👤 Visitor Information</h3>

            <div class="form-group">

                <label>Full Name <span class="required-star">*</span></label>

                <input
                    id="fullName"
                    type="text"
                    placeholder="Enter visitor name"
                    required
                >

            </div>

            <div class="form-group">

                <label>Email Address <span class="required-star">*</span></label>

                <input
                    id="email"
                    type="email"
                    placeholder="visitor@example.com"
                    required
                >

            </div>

            <div class="form-group">

                <label>Phone Number <span class="required-star">*</span></label>

                <input
                    id="phone"
                    type="tel"
                    placeholder="+91 XXXXXXXXXX"
                    required
                >

            </div>

            <div class="form-group">

                <label>Organization</label>

                <input
                    id="organization"
                    type="text"
                    placeholder="Company / Institute (Optional)"
                >

            </div>

        </section>

        <!-- Visit Details -->

        <section class="form-card">

            <h3>📅 Visit Details</h3>

            <div class="form-group">

                <label>Purpose <span class="required-star">*</span></label>

                <input
                    id="purpose"
                    type="text"
                    placeholder="Purpose of visit"
                    required
                >

            </div>

            <div class="form-group">

                <label>Visit Date <span class="required-star">*</span></label>

                <input
                    id="visitDate"
                    type="text"
                    required
                >

            </div>

        </section>

        <!-- Buttons -->

        <div class="action-buttons">

            <button
                id="cancelBtn"
                class="cancel-btn"
            >
                Cancel
            </button>

            <button
                id="inviteBtn"
                class="invite-btn-main"
            >
                + Invite Visitor
            </button>

        </div>

    </main>

</div>

<script src="create-visit.js"></script>

</body>
</html>
