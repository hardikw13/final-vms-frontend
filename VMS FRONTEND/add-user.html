<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add User</title>

<link rel="stylesheet" href="add-user.css">

</head>

<body>

<div class="container">

<header>

<h2>Add User</h2>

<a href="manage-users.html">
Back
</a>

</header>

<form id="addUserForm">

<div class="field">

<label>
Full Name
</label>

<input
type="text"
id="name"
placeholder="Enter name"
required>

</div>

<div class="field">

<label>
Email
</label>

<input
type="email"
id="email"
placeholder="Enter email"
required>

</div>
<div class="field" id="designationContainer">

    <label>Designation</label>

    <input
        type="text"
        id="designation"
        placeholder="Enter designation">

</div>
<div
class="field"
id="departmentContainer">

<label>
Department
</label>

<select id="department">

<option value="">
Select Department
</option>

</select>

</div>

<div class="field">

<label>
Role
</label>

<select id="role" required>

    <option value="">
        Select Role
    </option>

    <option value="1">
        ADMIN
    </option>

    <option value="2">
        SECURITY
    </option>

    <option value="3">
        HOST
    </option>

</select>

</div>

<!-- Head Host Toggle -->
<div
class="field"
id="headHostContainer"
style="display: none;">

<label for="isHead">
Make Department Head
</label>

<input
type="checkbox"
id="isHead">

</div>

<button type="submit">

Create User

</button>

</form>

<p id="message"></p>

</div>

<script src="add-user.js"></script>

</body>

</html>
