<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EduGate VMS | Host Dashboard</title>
<link rel="stylesheet" href="host-dashboard.css">
</head>
<body>

  <div class="app-frame">

    <header class="top-bar">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/>
          <path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-title-row">
          <h1 id="brandTitle">Host Dashboard</h1>
          <span class="role-pill" id="rolePill">Host</span>
        </div>
        <p id="hostSubtitle">Dr. Anjali Mehta, Dept. of CS</p>
      </div>
      <button class="icon-btn bell-btn" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="dot" aria-hidden="true"></span>
      </button>
    </header>

    <main class="content">

      <section class="stats-row" id="statsRow"><!-- stat cards injected by host-dashboard.js --></section>
     

      <nav class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="today" type="button">
          <span id="tabTodayLabel">Today's Visitors</span>
        </button>
        <!-- <button class="tab-btn" data-tab="notifications" type="button">
          <span id="tabNotificationsLabel">Notifications</span>
        </button> -->
      </nav>

      <section class="tab-panel active" id="panelToday">
        <div class="list" id="todayList"><!-- injected --></div>
      </section>

      <section class="tab-panel" id="panelNotifications">
        <div class="list" id="notificationsList"><!-- injected --></div>
      </section>
      <div class="dashboard-actions">

    <button id="inviteVisitorBtn" class="invite-btn">

        <span class="plus-icon">+</span>

        <span>Invite Visitor</span>

    </button>

</div>

      <button class="sign-out-btn" id="signOutBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span id="signOutText">Sign Out</span>
      </button>

    </main>

  </div>
  <!-- Reassign Modal -->
<div id="reassignModal" class="modal hidden">

  <div class="modal-content">

    <h2>Reassign Visit</h2>

    <label>Select New Host</label>

    <select id="hostSelect">

      <option value="">Select Host</option>

    </select>

    <div class="modal-buttons">

      <button id="cancelReassign">
        Cancel
      </button>

      <button id="confirmReassign">
        Assign
      </button>

    </div>

  </div>

</div>

  <script src="host-dashboard.js"></script>
</body>
</html>
