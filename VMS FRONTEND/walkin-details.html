<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EduGate VMS | Visitor Details</title>
<link rel="stylesheet" href="walkin-details.css">
</head>
<body>

  <div class="app-frame">

    <header class="top-bar">
      <button class="icon-btn back-btn" type="button" id="backBtn" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>

      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/>
          <path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>

      <div class="brand-text">
        <h1 id="brandTitle">Walk-in Registration</h1>
      </div>

      <button class="icon-btn bell-btn" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="dot" aria-hidden="true"></span>
      </button>
    </header>

    <nav class="step-indicator" id="stepIndicator" aria-label="Registration progress"></nav>

    <main class="content">

      <h2 class="section-title" id="pageTitle">Visitor details</h2>

      <section class="photo-card">
        <div class="photo-thumb" id="photoThumb">

          <svg id="photoPlaceholder" viewBox="0 0 24 24" fill="none" stroke="#9aa1b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/>
          </svg>

          <img id="photoImg" alt="Captured visitor photo" hidden>
        </div>

        <div class="photo-info">
          <p class="photo-status">
            <span id="photoCapturedText">Photo Captured</span>

            <svg viewBox="0 0 24 24" fill="none" stroke="#1c8a4c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </p>

          <p class="photo-note" id="photoNote">
            Your photo will be used for identity verification
          </p>

          <button class="btn-retake" id="retakeBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="7" width="20" height="14" rx="2"/>
              <circle cx="12" cy="14" r="3.5"/>
              <path d="M8 7l1.5-2.5h5L16 7"/>
            </svg>

            <span id="retakeBtnText">Retake Photo</span>
          </button>
        </div>
      </section>

      <form id="detailsForm">

        <h3 class="section-heading" id="personalInfoHeading">
          Personal Information
        </h3>

        <div class="field">
          <label for="firstName" id="firstNameLabel">
            First Name <span class="required">*</span>
          </label>

          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/>
            </svg>

            <input
              type="text"
              id="firstName"
              placeholder="Arjun"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="lastName" id="lastNameLabel">
            Last Name <span class="required">*</span>
          </label>

          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/>
            </svg>

            <input
              type="text"
              id="lastName"
              placeholder="Verma"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="email" id="emailLabel">
            Email Address <span class="required">*</span>
          </label>

          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <polyline points="2 6 12 13 22 6"/>
            </svg>

            <input
              type="email"
              id="email"
              placeholder="arjun.verma@example.com"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="phone" id="phoneLabel">
            Phone Number <span class="required">*</span>
          </label>

          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"/>
            </svg>

            <input
              type="tel"
              id="phone"
              placeholder="+91 82369xxx98"
              required
            >
          </div>
        </div>

        <h3 class="section-heading" id="visitInfoHeading">
          Visit Information
        </h3>

        <div class="field">
          <label for="purpose" id="purposeLabel">
            Purpose of Visit <span class="required">*</span>
          </label>

          <select id="purpose" required>
            <option value="">Select...</option>
            <option value="Meeting">Meeting</option>
            <option value="Interview">Interview</option>
            <option value="Delivery Pickup">Delivery Pickup</option>
            <option value="Event">Event</option>
            <option value="Maintenance">Maintenance</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="department" id="departmentLabel">
            Department <span class="required">*</span>
          </label>

          <select id="department" required>
            <option value="">Select Department...</option>
          </select>
        </div>

        <div class="field">
          <label for="personToMeet" id="personToMeetLabel">
            Person to Meet
          </label>

          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/>
            </svg>

            <input
              type="text"
              id="personToMeet"
              placeholder="Select a department first"
              readonly
            >
          </div>
        </div>

        <button class="btn-primary" id="submitBtn" type="submit">
          Send OTP to Email
        </button>

      </form>

    </main>

  </div>

  <script src="walkin-details.js"></script>

</body>
</html>
