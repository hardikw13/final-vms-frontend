<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EduGate VMS | Face Capture</title>
<link rel="stylesheet" href="walkin-photo.css">
</head>
<body>

  <div class="app-frame">

    <header class="top-bar">
      <button class="icon-btn back-btn" type="button" id="backBtn" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/>
          <path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>
      <div class="brand-text"><h1 id="brandTitle">Walk-in Registration</h1></div>
      <button class="icon-btn bell-btn" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="dot" aria-hidden="true"></span>
      </button>
    </header>

    <nav class="step-indicator" id="stepIndicator" aria-label="Registration progress"></nav>

    <main class="content">

      <section class="face-card">
        <h2 id="faceTitle">Face Capture</h2>
        <p id="faceSubtitle">Look directly at the camera for identity verification</p>

        <div class="camera-frame" id="cameraFrame">

  <video
      id="cameraVideo"
      autoplay
      playsinline
      muted
      hidden>
  </video>

  <canvas id="overlayCanvas"></canvas>

  <svg
      id="cameraPlaceholder"
      viewBox="0 0 24 24"
      fill="none"
      stroke="#3346e8"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round">

    <rect x="2" y="7" width="20" height="14" rx="2"/>
    <circle cx="12" cy="14" r="3.5"/>
    <path d="M8 7l1.5-2.5h5L16 7"/>

  </svg>

</div>

<p id="faceStatus" class="face-status">
    Looking for a face...
</p>

<div id="debugPanel" class="debug-panel">
    <div>Faces : <span id="debugFaces">0</span></div>
    <div>Width : <span id="debugWidth">0</span></div>
    <div>Height : <span id="debugHeight">0</span></div>
    <div>Confidence : <span id="debugConfidence">0</span></div>

    <div>Offset X : <span id="debugOffsetX">0</span></div>
    <div>Offset Y : <span id="debugOffsetY">0</span></div>
</div>


        <div class="tips-row" id="tipsRow"><!-- tips injected by walkin-photo.js --></div>
      </section>

      <button class="btn-primary btn-capture" id="captureBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><circle cx="12" cy="14" r="3.5"/><path d="M8 7l1.5-2.5h5L16 7"/></svg>
        <span id="captureBtnText">Capture Photo</span>
      </button>

      <canvas id="captureCanvas" hidden></canvas>

    </main>

  </div>

  

<script type="module" src="walkin-photo.js"></script>
<div id="photoPreviewModal" class="preview-modal" hidden>

    <div class="preview-box">

        <h2>Preview Photo</h2>

        <img id="previewImage">

        <div class="preview-buttons">

            <button id="retakeBtn">
                Retake
            </button>

            <button id="continueBtn">
                Continue
            </button>

        </div>

    </div>

</div>
</body>
</html>
