<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EduGate VMS | Welcome</title>
<link rel="stylesheet" href="welcome.css">
</head>
<body>

  <div class="app-frame" id="appFrame">

    <!-- Logo + brand name: appears ONLY here on this page -->
    <header class="brand-header">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/>
          <path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1 id="brandName">EduGate VMS</h1>
        <p id="brandTagline">Visitor Management System</p>
      </div>
    </header>

    <main class="content">

      <section class="hero">
        <div class="hero-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <h2 id="heroTitle">Welcome to EduGate</h2>
        <p id="heroSubtitle">Secure, smart visitor management for modern educational institutions</p>
      </section>

      <section class="actions" id="actionsContainer">
        <!-- action cards injected by welcome.js -->
      </section>

      <section class="trust-strip">
        <div class="trust-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <p>Trusted by educational institutions across India for secure, monitored campus entry</p>
      </section>

    </main>

  </div>

  <script src="welcome.js"></script>
</body>
</html>
