<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EduGate VMS | Verify Email</title>
<link rel="stylesheet" href="walkin-otp.css">
</head>
<body>

  <div class="app-frame">

    <header class="top-bar">
      <button class="icon-btn back-btn" type="button" id="backBtn" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/>
          <path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>
      <div class="brand-text"><h1 id="brandTitle">Walk-in Registration</h1></div>
      <button class="icon-btn bell-btn" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="dot" aria-hidden="true"></span>
      </button>
    </header>

    <nav class="step-indicator" id="stepIndicator" aria-label="Registration progress"></nav>

    <main class="content">

      <div class="otp-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3346e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
      </div>

      <h2 id="otpTitle">Verify Your Email</h2>
      <p id="otpSubtitle">We've sent a 6 digit verification code to <strong id="maskedEmail">you***@example.com</strong></p>
      <a href="walkin-details.html" class="change-email-link" id="changeEmailLink">Change Email</a>

      <div class="otp-inputs" id="otpInputs">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box">
      </div>

      <p class="timer-text" id="timerText">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="timerLabel">Code expires in</span> <span id="timerValue">4:59</span>
      </p>

      <button class="btn-primary" id="verifyBtn" type="button" disabled>Verify OTP</button>

      <p class="resend-text">
        <span id="resendPrompt">Didn't receive the code?</span>
        <button class="link-btn" id="resendBtn" type="button">Resend OTP</button>
      </p>

      <p class="security-note" id="securityNote">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        For security, do not share this code with anyone
      </p>

    </main>

  </div>

  <script src="walkin-otp.js"></script>
</body>
</html>
