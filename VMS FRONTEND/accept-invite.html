<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activate Account</title>

<link rel="stylesheet" href="accept-invite.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h2>Activate Your Account</h2>

        <p id="userInfo">
            Checking invitation...
        </p>

        <form id="inviteForm">

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    readonly
                >

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    readonly
                >

            </div>

            <div class="form-group">

                <label>Role</label>

                <input
                    type="text"
                    id="role"
                    readonly
                >

            </div>

            <div class="form-group">

                <label>Create Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    minlength="8"
                    required
                >

            </div>

            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    minlength="8"
                    required
                >

            </div>

            <button type="submit">
                Activate Account
            </button>

        </form>

        <p id="message"></p>

    </div>

</div>

<script src="accept-invite.js"></script>

</body>
</html>
