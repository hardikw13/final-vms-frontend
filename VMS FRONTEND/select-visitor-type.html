<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EduGate VMS | Select Visitor Type</title>
<link rel="stylesheet" href="select-visitor-type.css">
</head>
<body>

  <div class="app-frame" id="appFrame">

    <!-- Logo + brand name -->
    <header class="top-bar">

      <!-- Updated Back Button -->
      <a href="welcome.html" class="icon-btn back-btn" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </a>

      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/>
          <path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>

      <div class="brand-text">
        <h1 id="brandName">EduGate VMS</h1>
        <p id="brandTagline">Select Visitor Type</p>
      </div>

      <!-- <button class="icon-btn bell-btn" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="dot" aria-hidden="true"></span>
      </button> -->

    </header>

    <main class="content">

      <section class="heading">
        <h2 id="headingTitle">How are you visiting today?</h2>
        <p id="headingSubtitle">Choose your visitor category to continue</p>
      </section>

      <section class="type-list" id="typeList">
        <!-- Visitor cards injected by JS -->
      </section>

    </main>

  </div>

  <script src="select-visitor-type.js"></script>

</body>
</html>
