<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EduGate VMS | Delivery Submitted</title>
<link rel="stylesheet" href="delivery-personnel-success.css">
</head>
<body>

  <div class="app-frame">

    <header class="top-bar">
      <button class="icon-btn back-btn" type="button" id="backBtn" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/>
          <path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1 id="brandTitle">Delivery Personnel</h1>
      </div>

      <button class="icon-btn bell-btn" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="dot" aria-hidden="true"></span>
      </button>
    </header>

    <main class="content">

      <section class="success-header">
        <div class="success-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2 id="successTitle">Submitted!</h2>
        <p id="successSubtitle">Your delivery details have been sent to the security desk for verification.</p>
      </section>

      <section class="pass-card">
        <div class="pass-top">
          <span class="pass-label" id="passLabel">Delivery Pass</span>
          <div class="pass-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><line x1="12" y1="13" x2="12" y2="21"/></svg>
          </div>
        </div>

        <div class="pass-grid" id="passGrid">
          <!-- rows injected by delivery-personnel-success.js -->
        </div>

        <div class="pass-status" id="passStatus">Awaiting security confirmation</div>
      </section>

      <button class="btn-secondary" id="doneBtn" type="button">Done · Return to home</button>

    </main>

  </div>

  <script src="delivery-personnel-success.js"></script>
</body>
</html>
