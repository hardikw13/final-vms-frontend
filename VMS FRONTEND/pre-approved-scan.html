<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EduGate VMS | Scan QR Code</title>
<link rel="stylesheet" href="pre-approved-scan.css">

<!-- NEW: constrain the live camera feed to the viewfinder box only,
     instead of it stretching full width/height of the screen -->
<style>
  .viewfinder {
    position: relative;
    overflow: hidden;
  }

  .qr-video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: inherit;
    z-index: 0;
  }

  .scan-frame {
    position: relative;
    z-index: 1;
  }

  .scanning-text {
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>

  <div class="app-frame">

    <header class="top-bar">
      <button class="icon-btn back-btn" type="button" id="backBtn" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/>
          <path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1 id="brandTitle">Pre Approved Visitor</h1>
      </div>

      <button class="icon-btn bell-btn" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="dot" aria-hidden="true"></span>
      </button>
    </header>

    <main class="content">

      <section class="scan-card">
        <div class="scan-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#3346e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><line x1="14" y1="14" x2="14" y2="21"/><line x1="21" y1="14" x2="21" y2="21"/><line x1="17.5" y1="14" x2="17.5" y2="17.5"/><line x1="14" y1="17.5" x2="21" y2="17.5"/></svg>
        </div>

        <h2 id="scanTitle">Scan Your QR Code</h2>
        <p id="scanSubtitle">Position your invitation QR code in front of the camera</p>

        <div class="viewfinder">
          <!-- live camera feed, confined to this box via CSS above -->
          <video id="qrVideo" autoplay playsinline muted class="qr-video"></video>
          <!-- hidden canvas used only to grab frames/images for decoding -->
          <canvas id="qrCanvas" style="display:none;"></canvas>

          <div class="scan-frame">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
          </div>
          <p class="scanning-text" id="scanningLabel">Scanning<span class="dots">...</span></p>
        </div>

        <!-- "Upload From Gallery" removed. Single button handles gallery upload —
             decodes the image and goes straight to confirm. -->
        <button class="btn-primary" id="galleryBtn" type="button">📁 Upload from Gallery</button>
        <input type="file" id="galleryInput" accept="image/*" style="display:none;">
      </section>

      <p class="alt-link">
        <span id="altText">Don't have a QR code?</span>
        <a id="altLink" href="walkin-photo.html">Register as Walk-in</a>
      </p>

    </main>

  </div>

  <!-- NEW: jsQR library — tries jsDelivr first, falls back to cdnjs automatically
       if the first CDN fails to load (blocked network, DNS issue, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"
          onerror="var s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js'; document.head.appendChild(s);">
  </script>
  <script src="pre-approved-scan.js"></script>
</body>
</html>
